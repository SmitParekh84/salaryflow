name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:22-alpine, so CI runs what ships.
          # Next 16 refuses to start below 20.9 anyway.
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # No `version`: package.json's `packageManager` already pins pnpm, and
          # action-setup v4 refuses to run when it is told twice. Naming it here
          # as well is also how the two drift apart.
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        continue-on-error: true
        run: pnpm lint || true

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
