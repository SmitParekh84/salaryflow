name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          echo "=== node_modules listing (root) ==="
          ls -la node_modules | sed -n '1,200p' || true
          echo "=== check next installed ==="
          npm ls next --depth=0 || true

      - name: Run ESLint
        continue-on-error: true
        run: npm run lint --if-present || true

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Verify Next resolution
        run: |
          node -e "try{console.log(require.resolve('next/package.json'))}catch(e){console.error('NEXT_RESOLVE_FAILED', e.message); process.exit(1)}"

      - name: Build
        run: npm run build

      - name: Upload Next build output (artifacts)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
